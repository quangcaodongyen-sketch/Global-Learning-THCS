<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="glowRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="coralGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185"/>
      <stop offset="100%" stop-color="#e11d48"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Neon Pulse Glow Ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#glowRing)" stroke-width="4" stroke-dasharray="8 6" opacity="0.85" filter="url(#neonGlow)"/>

  <!-- Background Base Circle -->
  <circle cx="100" cy="100" r="84" fill="#0f172a" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

  <!-- Inner Sound Wave Rings -->
  <path d="M 28 100 A 72 72 0 0 1 172 100" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 38 100 A 62 62 0 0 1 162 100" fill="none" stroke="rgba(168, 85, 247, 0.3)" stroke-width="2"/>

  <!-- Owl Body -->
  <ellipse cx="100" cy="115" rx="46" ry="50" fill="url(#bgGrad)"/>

  <!-- Owl Belly with Feather Pattern -->
  <ellipse cx="100" cy="125" rx="32" ry="36" fill="#1e293b"/>
  <path d="M 85 116 Q 100 126 115 116" fill="none" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 82 128 Q 100 138 118 128" fill="none" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
  <path d="M 88 140 Q 100 148 112 140" fill="none" stroke="#a855f7" stroke-width="3" stroke-linecap="round"/>

  <!-- Owl Big Eyes (Glass Duolingo/Smart Style) -->
  <!-- Left Eye -->
  <circle cx="78" cy="95" r="22" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
  <circle cx="80" cy="95" r="14" fill="#0f172a"/>
  <circle cx="82" cy="95" r="11" fill="#06b6d4"/>
  <circle cx="84" cy="93" r="5" fill="#ffffff"/>
  <circle cx="78" cy="99" r="2" fill="#ffffff"/>

  <!-- Right Eye -->
  <circle cx="122" cy="95" r="22" fill="#ffffff" filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"/>
  <circle cx="120" cy="95" r="14" fill="#0f172a"/>
  <circle cx="118" cy="95" r="11" fill="#06b6d4"/>
  <circle cx="116" cy="93" r="5" fill="#ffffff"/>
  <circle cx="122" cy="99" r="2" fill="#ffffff"/>

  <!-- Cute Beak -->
  <polygon points="94,106 106,106 100,120" fill="url(#goldGrad)" filter="drop-shadow(0 2px 2px rgba(0,0,0,0.3))"/>

  <!-- DJ Headphones (Neon Blue / Coral Accent) -->
  <!-- Headband -->
  <path d="M 52 92 C 52 46 148 46 148 92" fill="none" stroke="#0ea5e9" stroke-width="8" stroke-linecap="round"/>
  <path d="M 58 92 C 58 54 142 54 142 92" fill="none" stroke="#38bdf8" stroke-width="3"/>
  <!-- Left Ear Cushion -->
  <rect x="44" y="80" width="16" height="34" rx="8" fill="url(#coralGrad)" stroke="#ffffff" stroke-width="1.5" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.5))"/>
  <!-- Right Ear Cushion -->
  <rect x="140" y="80" width="16" height="34" rx="8" fill="url(#coralGrad)" stroke="#ffffff" stroke-width="1.5" filter="drop-shadow(0 2px 5px rgba(0,0,0,0.5))"/>

  <!-- Microphone Attached to Headphone -->
  <path d="M 52 104 Q 52 135 78 135" fill="none" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="82" cy="135" r="7" fill="url(#coralGrad)" stroke="#ffffff" stroke-width="1.5" filter="url(#neonGlow)"/>
  <!-- Voice Waves from Mic -->
  <path d="M 93 131 Q 97 135 93 139" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 98 128 Q 104 135 98 142" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Graduation Cap (Mũ Cử Nhân Đỉnh Cao Tri Thức) -->
  <polygon points="100,32 144,48 100,64 56,48" fill="#1e1b4b" stroke="#fde047" stroke-width="2"/>
  <polygon points="68,52 68,68 100,78 132,68 132,52 100,64" fill="#0f172a" opacity="0.8"/>
  <polygon points="100,32 144,48 100,64 56,48" fill="url(#goldGrad)" opacity="0.15"/>
  <!-- Tassel (Dải tua rua vàng) -->
  <circle cx="100" cy="48" r="4" fill="#fde047"/>
  <path d="M 100 48 Q 130 52 138 68" fill="none" stroke="#fde047" stroke-width="2.5"/>
  <rect x="135" y="66" width="6" height="12" rx="2" fill="#d97706"/>

  <!-- Sparkle Stars -->
  <polygon points="34,44 37,35 46,38 37,41" fill="#fde047"/>
  <polygon points="166,42 163,33 154,36 163,39" fill="#38bdf8"/>
  <polygon points="168,148 171,142 177,144 171,146" fill="#f43f5e"/>
</svg>
